name: Build Therapie IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          python3 -m venv /tmp/therapie-icon
          source /tmp/therapie-icon/bin/activate
          pip install --quiet pillow
          python scripts/generate_icon.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild             -project Therapie.xcodeproj             -scheme TherapieApp             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          rm -rf Payload Therapie.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Therapie.ipa Payload
          ls -lh Therapie.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-IPA
          path: Therapie.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
