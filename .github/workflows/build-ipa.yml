name: Build Therapie IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv /tmp/therapie-icon
          source /tmp/therapie-icon/bin/activate
          pip install --quiet pillow

      - name: Generate app icon
        run: |
          source /tmp/therapie-icon/bin/activate
          python scripts/generate_icon.py
          file TherapieApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project Therapie.xcodeproj \
            -scheme TherapieApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Validate actual iPhone bundle
        run: python3 scripts/validate_bundle.py build/Build/Products/Release-iphoneos/Therapie.app

      - name: Verify full screen and navigation on two iPhone simulators
        run: |
          set -o pipefail
          python3 - <<'PYTHON'
          import json, subprocess
          listing = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          phones = [d for runtime, ds in listing["devices"].items() if "iOS" in runtime for d in ds if "iPhone" in d["name"]]
          large = next((d for d in phones if "Pro Max" in d["name"]), phones[0])
          small = next((d for d in phones if "16e" in d["name"] or "17e" in d["name"]), next(d for d in phones if d["udid"] != large["udid"]))
          for label, device in [("large", large), ("compact", small)]:
              print("Testing", label, device["name"], flush=True)
              subprocess.run(["xcodebuild", "test", "-project", "Therapie.xcodeproj", "-scheme", "TherapieApp",
                              "-destination", "platform=iOS Simulator,id=" + device["udid"],
                              "-derivedDataPath", "build-simulator", "-resultBundlePath", "build/" + label + ".xcresult",
                              "-parallel-testing-enabled", "NO", "CODE_SIGNING_ALLOWED=NO"], check=True)
              subprocess.run(["xcrun", "xcresulttool", "export", "attachments", "--path", "build/" + label + ".xcresult",
                              "--output-path", "build/screenshots-" + label], check=True)
          PYTHON

      - name: Upload simulator screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-UI-Verification
          path: |
            build/*.xcresult
            build/screenshots-*
          if-no-files-found: ignore
          retention-days: 30

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          rm -rf Payload Therapie-v1.2.0.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Therapie-v1.2.0.ipa Payload
          ls -lh Therapie-v1.2.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-v1.2.0-IPA
          path: Therapie-v1.2.0.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-build-log
          path: xcodebuild.log
          if-no-files-found: ignore

