name: Build Therapie IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv /tmp/therapie-icon
          source /tmp/therapie-icon/bin/activate
          pip install --quiet pillow

      - name: Generate app icon
        run: |
          source /tmp/therapie-icon/bin/activate
          python scripts/generate_icon.py
          file TherapieApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project Therapie.xcodeproj \
            -scheme TherapieApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Validate actual iPhone bundle
        run: python3 scripts/validate_bundle.py build/Build/Products/Release-iphoneos/Therapie.app

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -project Therapie.xcodeproj -scheme TherapieApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build | tee simulator-build.log

      - name: Verify native full-screen rendering on two iPhone sizes
        timeout-minutes: 12
        run: |
          set +e
          python3 scripts/verify_simulator.py
          VERIFY_STATUS=$?
          if [ "$VERIFY_STATUS" -eq 75 ]; then
            echo "::warning::Hosted simulator could not boot. Device build and bundle validation passed; runtime verification remains incomplete."
            echo "Simulator could not boot; runtime verification was not completed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$VERIFY_STATUS"

      - name: Upload simulator screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-UI-Verification
          path: |
            build/simulator-verification
          if-no-files-found: ignore
          retention-days: 30

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          rm -rf Payload Therapie-v1.2.0.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Therapie-v1.2.0.ipa Payload
          ls -lh Therapie-v1.2.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-v1.2.0-IPA
          path: Therapie-v1.2.0.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-build-log
          path: |
            xcodebuild.log
            simulator-build.log
          if-no-files-found: ignore

