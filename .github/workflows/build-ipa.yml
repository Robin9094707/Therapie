name: Build Therapie IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      verify_simulator:
        description: Run optional hosted iPhone simulator verification
        type: boolean
        default: false

      verify_checkin:
        description: Run saved check-in overview and safe task removal UI regressions
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv /tmp/therapie-icon
          source /tmp/therapie-icon/bin/activate
          pip install --quiet pillow

      - name: Generate app icon
        run: |
          source /tmp/therapie-icon/bin/activate
          python scripts/generate_icon.py
          file TherapieApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Warm focused iPhone simulator during the build
        if: contains(github.event.head_commit.message, '[checkin-ui]') || (github.event_name == 'workflow_dispatch' && inputs.verify_checkin)
        run: python3 scripts/warm_ui_simulator.py

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project Therapie.xcodeproj \
            -scheme TherapieApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Validate actual iPhone bundle
        run: python3 scripts/validate_bundle.py build/Build/Products/Release-iphoneos/Therapie.app

      - name: Test data migration, weekly streaks, charts and CSV export
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift Tests/ModelChecks.swift -o /tmp/therapie-model-checks
          /tmp/therapie-model-checks

      - name: Test guided check-ins and routine scheduling
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift Tests/CompanionChecks.swift -o /tmp/therapie-companion-checks
          /tmp/therapie-companion-checks

      - name: Test Insights, timed check-ins and alarm inventory
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift TherapieApp/WeeklyPrintModels.swift Tests/InsightsChecks.swift -o /tmp/therapie-insights-checks
          /tmp/therapie-insights-checks

      - name: Test cancellations, vacations and section alarms
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift Tests/AppointmentChecks.swift -o /tmp/therapie-appointment-checks
          /tmp/therapie-appointment-checks

      - name: Render and verify actual weekly PDF layouts
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift TherapieApp/WeeklyPrintModels.swift TherapieApp/WeeklyPDFRenderer.swift Tests/WeeklyPDFChecks.swift -o /tmp/therapie-pdf-checks
          /tmp/therapie-pdf-checks build/pdf-verification

      - name: Upload printable PDF fixtures and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-PDF-Verification
          path: build/pdf-verification
          if-no-files-found: ignore
          retention-days: 30

      - name: Test real Live Activity phase names and boundaries
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift Shared/TherapyPhaseTimeline.swift Shared/TherapyActivityAttributes.swift Tests/LivePhaseChecks.swift -o /tmp/therapie-live-phase-checks
          /tmp/therapie-live-phase-checks

      - name: Test dashboard, archive, widget privacy and time boundaries
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift Shared/WidgetSnapshot.swift TherapieApp/WidgetSnapshotBuilder.swift Tests/PersonalizationChecks.swift -o /tmp/therapie-personalization-checks
          /tmp/therapie-personalization-checks

      - name: Test duplicate protection, flexible dates, therapy agenda and offline OpenAI integration
        run: |
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift TherapieApp/AIBuddyAPI.swift TherapieApp/AIBuddyActions.swift Tests/BuddyChecks.swift -o /tmp/therapie-buddy-checks
          /tmp/therapie-buddy-checks

      - name: Test encrypted portable backups and recovery
        run: |
          set -o pipefail
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift TherapieApp/BackupArchive.swift Tests/BackupChecks.swift -o /tmp/therapie-backup-checks 2>&1 | tee backup-tests.log
          /tmp/therapie-backup-checks 2>&1 | tee -a backup-tests.log

      - name: Test readable ZIP, Files migration and task reminders
        run: |
          set -o pipefail
          swiftc TherapieApp/Models.swift TherapieApp/AIBuddyModels.swift TherapieApp/TherapyDiscussionModels.swift TherapieApp/DashboardModels.swift TherapieApp/ArchiveModels.swift TherapieApp/WellnessModels.swift TherapieApp/TherapyModels.swift TherapieApp/ReminderModels.swift TherapieApp/CompanionModels.swift TherapieApp/InsightsModels.swift TherapieApp/BackupArchive.swift TherapieApp/ReadableBackup.swift Tests/StorageReminderChecks.swift -o /tmp/therapie-storage-checks 2>&1 | tee storage-tests.log
          /tmp/therapie-storage-checks 2>&1 | tee -a storage-tests.log
          python3 scripts/verify_readable_zip.py /tmp/therapie-portable-check.zip

      - name: Verify notes, attachments, appointments and check-in regressions
        if: contains(github.event.head_commit.message, '[checkin-ui]') || (github.event_name == 'workflow_dispatch' && inputs.verify_checkin)
        timeout-minutes: 22
        run: |
          set +e
          python3 scripts/verify_checkin_removal.py
          VERIFY_STATUS=$?
          if [ "$VERIFY_STATUS" -eq 75 ]; then
            echo "::warning::Hosted simulator unavailable; focused UI regression was not executed. Model regression and device build passed."
            echo "Check-in UI regression: hosted simulator unavailable; not executed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$VERIFY_STATUS"

      - name: Upload check-in regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-CheckIn-Regression
          path: build/checkin-regression
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare compact native UI previews
        if: always()
        run: /tmp/therapie-icon/bin/python scripts/compact_ui_previews.py

      - name: Upload compact native UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-UI-Previews
          path: |
            build/checkin-regression/compact-previews
            build/checkin-regression/status.json
            build/checkin-regression/test.log
            build/checkin-regression/preview-export.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build simulator app
        if: github.event_name == 'workflow_dispatch' && inputs.verify_simulator
        run: |
          set -o pipefail
          xcodebuild -project Therapie.xcodeproj -scheme TherapieApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build | tee simulator-build.log

      - name: Verify native full-screen rendering on two iPhone sizes
        if: github.event_name == 'workflow_dispatch' && inputs.verify_simulator
        timeout-minutes: 12
        run: |
          set +e
          python3 scripts/verify_simulator.py
          VERIFY_STATUS=$?
          if [ "$VERIFY_STATUS" -eq 75 ]; then
            echo "::warning::Hosted simulator could not boot. Device build and bundle validation passed; runtime verification remains incomplete."
            echo "Simulator could not boot; runtime verification was not completed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$VERIFY_STATUS"

      - name: Upload simulator screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-UI-Verification
          path: |
            build/simulator-verification
          if-no-files-found: ignore
          retention-days: 30

      - name: Package recoverable source snapshots
        run: |
          git archive --format=zip --output=Therapie-v3009.0.0-source.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-v3009.0.0-source
          path: Therapie-v3009.0.0-source.zip
          if-no-files-found: error
          retention-days: 90

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          rm -rf Payload Therapie-v3009.0.0.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Therapie-v3009.0.0.ipa Payload
          ls -lh Therapie-v3009.0.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-v3009.0.0-IPA
          path: Therapie-v3009.0.0.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Therapie-build-log
          path: |
            xcodebuild.log
            simulator-build.log
            backup-tests.log
            storage-tests.log
          if-no-files-found: ignore
