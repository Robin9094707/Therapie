name: Therapie
options:
  bundleIdPrefix: eu.rjuhas
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 3001.0.0
targets:
  TherapieApp:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: TherapieApp
      - path: Shared
    dependencies:
      - target: TherapieLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.therapie
        PRODUCT_NAME: Therapie
        INFOPLIST_FILE: TherapieApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  TherapieLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: TherapieLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.therapie.liveactivity
        INFOPLIST_FILE: TherapieLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  TherapieUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: TherapieUITests
    dependencies:
      - target: TherapieApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.therapie.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TherapieApp
schemes:
  TherapieApp:
    build:
      targets:
        TherapieApp: all
    run:
      config: Debug
    archive:
      config: Release

    test:
      config: Debug
      targets:
        - TherapieUITests
