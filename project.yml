name: Therapie
options:
  bundleIdPrefix: eu.rjuhas
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.1.0
targets:
  TherapieApp:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: TherapieApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.therapie
        PRODUCT_NAME: Therapie
        INFOPLIST_FILE: TherapieApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  TherapieApp:
    build:
      targets:
        TherapieApp: all
    run:
      config: Debug
    archive:
      config: Release
